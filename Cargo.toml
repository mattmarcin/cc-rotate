[workspace]
resolver = "3"
members = ["crates/ccr-core", "crates/ccr-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mattmarcin/cc-rotate"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
